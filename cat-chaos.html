<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cat Chaos — Productivity Edition</title>
<style>
:root{--ink:#18202a;--paper:#fffaf0;--orange:#ff7a45;--yellow:#ffd85a;--blue:#3f80ff;--mint:#70dfbd;--pink:#ff9fc4;--line:#18202a;--muted:#6c7180}*{box-sizing:border-box}body{margin:0;min-width:320px;background:#8fd8ff;color:var(--ink);font-family:Arial,sans-serif}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:4px solid var(--blue);outline-offset:3px}.hidden{display:none!important}.center{min-height:100svh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 15% 15%,#fff0 0 8%,#ffffff80 8.5% 9%,transparent 9.5%),linear-gradient(155deg,#89dcff,#d3a9ff)}.intro,.end{width:min(620px,100%);background:var(--paper);border:4px solid var(--ink);box-shadow:12px 12px 0 var(--ink);padding:clamp(24px,5vw,48px);text-align:center}.cats{display:flex;justify-content:center;align-items:end;margin-bottom:8px}.cat{font-size:clamp(4rem,15vw,7rem);filter:drop-shadow(4px 5px 0 #18202a30)}.cat:last-child{transform:scaleX(-1) translateX(8px)}.kicker{font-size:.76rem;font-weight:900;letter-spacing:.2em;margin:0 0 12px}.intro h1{font-size:clamp(3.2rem,11vw,6.3rem);line-height:.77;letter-spacing:-.07em;margin:0}.intro h1 span{color:var(--orange)}.introText{font-size:1.02rem;line-height:1.6;max-width:470px;margin:28px auto}.mission{display:grid;grid-template-columns:auto 1fr;text-align:left;gap:14px;align-items:center;background:#fff;border:2px solid var(--ink);padding:15px;margin:18px 0}.mission>span{font-size:2rem}.mission b,.mission small{display:block}.mission small{color:var(--muted);margin-top:4px;line-height:1.4}.primary{width:100%;min-height:56px;background:var(--yellow);border:3px solid var(--ink);font-weight:900;box-shadow:5px 5px 0 var(--ink)}.primary:hover{transform:translate(2px,2px);box-shadow:3px 3px 0 var(--ink)}.fine{font-size:.75rem;color:var(--muted);margin-bottom:0}
.game{min-height:100svh;max-width:1200px;margin:auto;background:var(--paper);padding:18px clamp(13px,4vw,42px) 35px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--ink);padding-bottom:13px}.brand{display:flex;gap:10px;align-items:center}.mark{width:44px;height:44px;display:grid;place-items:center;background:var(--orange);border:2px solid var(--ink);font-size:1.5rem;box-shadow:3px 3px 0 var(--ink)}.brand b,.brand small{display:block}.brand small{font-size:.7rem;color:var(--muted)}.turn{font-size:.72rem;letter-spacing:.12em}.turn b{font-size:1.1rem;color:var(--orange)}.hud{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin:17px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{display:flex;gap:9px;align-items:center;border:2px solid var(--ink);background:#fff;padding:9px 11px}.stat>span{font-size:1.25rem}.stat small,.stat b{display:block}.stat small{font-size:.62rem;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}.stat b{font-size:1.25rem}.taskBox{background:var(--ink);color:#fff;padding:11px 14px}.taskTop{display:flex;justify-content:space-between;font-size:.7rem;letter-spacing:.12em;font-weight:900}.taskTop b{color:var(--yellow)}.bar{height:11px;background:#39414b;margin-top:10px;border:1px solid #ffffff55}.bar i{height:100%;display:block;background:var(--mint);transition:width .35s}.arena{display:grid;grid-template-columns:minmax(0,720px) 1fr;gap:clamp(20px,5vw,60px);align-items:start}.event{background:#fff;border:4px solid var(--ink);box-shadow:9px 9px 0 var(--ink);overflow:hidden;min-height:515px;display:flex;flex-direction:column;animation:pop .25s ease-out}.eventHead{min-height:135px;background:var(--orange);border-bottom:4px solid var(--ink);display:flex;justify-content:space-between;align-items:flex-start;padding:20px 24px}.type{border:2px solid var(--ink);background:var(--paper);font-size:.67rem;font-weight:900;letter-spacing:.13em;padding:7px 9px}.bigEmoji{font-size:4rem;filter:drop-shadow(3px 4px 0 #0004)}.eventCopy{padding:25px 26px 16px}.eventCopy h2{font-size:clamp(2rem,5vw,3.5rem);text-transform:uppercase;line-height:.92;letter-spacing:-.055em;margin:0 0 13px}.eventCopy p{line-height:1.55;color:#555b67;margin:0}.actions{margin-top:auto;padding:0 26px 26px}.actions>p{font-size:.66rem;font-weight:900;letter-spacing:.15em}.action{width:100%;min-height:64px;border:2px solid var(--ink);background:var(--paper);margin-top:8px;padding:9px 11px;display:grid;grid-template-columns:37px 1fr auto;text-align:left;align-items:center;gap:11px}.action:hover{background:#fff0bd;transform:translateX(3px)}.key{width:35px;height:35px;border:2px solid var(--ink);display:grid;place-items:center;background:var(--yellow);font-weight:900}.action b,.action small{display:block}.action small{font-size:.76rem;color:var(--muted);margin-top:3px}.outcome{margin:auto 26px 26px;padding:23px;border:3px solid var(--ink);background:#fff0bd;text-align:center}.outcome .face{font-size:2.3rem}.outcome p{line-height:1.5}.outcome button{background:var(--blue);border:2px solid var(--ink);color:#fff;padding:12px 20px;font-weight:900}
.room{border:3px solid var(--ink);background:#d8edff;min-height:420px;position:relative;overflow:hidden;padding:18px}.room:before{content:"";position:absolute;left:0;right:0;bottom:0;height:36%;background:#ffcf8d;border-top:3px solid var(--ink)}.window{width:110px;height:100px;border:5px solid var(--ink);background:#89d8ff;position:relative}.window:before,.window:after{content:"";position:absolute;background:var(--ink)}.window:before{width:4px;height:100%;left:50%}.window:after{height:4px;width:100%;top:50%}.desk{position:absolute;z-index:2;bottom:54px;left:13%;width:74%;height:16px;background:#a6673d;border:3px solid var(--ink)}.desk:before,.desk:after{content:"";position:absolute;top:12px;width:12px;height:75px;background:#a6673d;border:3px solid var(--ink)}.desk:before{left:12px}.desk:after{right:12px}.laptop{position:absolute;z-index:3;bottom:70px;left:38%;width:95px;height:64px;background:#5d6b7c;border:4px solid var(--ink);border-radius:5px}.laptop:after{content:"TASKS";font-size:.65rem;font-weight:900;color:#fff;display:grid;place-items:center;height:100%}.roomCat{position:absolute;z-index:5;font-size:4.4rem;right:10%;bottom:68px;animation:bob 1.2s infinite alternate}.roomCat.two{font-size:3.8rem;right:auto;left:7%;bottom:10px;transform:scaleX(-1)}.mess{position:absolute;z-index:4;font-size:1.8rem}.m1{right:10%;bottom:15px}.m2{left:11%;bottom:100px}.roomLabel{position:absolute;right:13px;top:13px;font-size:.65rem;font-weight:900;letter-spacing:.12em;background:#fff;border:2px solid var(--ink);padding:6px}.tip{font-size:.82rem;line-height:1.5;color:var(--muted);text-align:center;margin:15px 10px}.end h2{font-size:clamp(2.2rem,8vw,4.5rem);line-height:.95;margin:10px 0 16px}.score{font-size:4rem;font-weight:900;color:var(--orange);line-height:1}.grade{display:inline-block;background:var(--ink);color:#fff;padding:7px 12px;margin:12px}.summary{line-height:1.6}.finalStats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:24px 0}@keyframes pop{from{transform:translateY(12px);opacity:.5}}@keyframes bob{to{transform:translateY(-7px) rotate(2deg)}}@media(max-width:780px){.game{padding:11px 11px 28px}.hud{grid-template-columns:1fr}.stats{gap:5px}.stat{padding:7px}.arena{display:block}.room{display:none}.event{min-height:0;box-shadow:6px 6px 0 var(--ink)}.eventHead{min-height:92px;padding:14px 17px}.bigEmoji{font-size:3rem}.eventCopy{padding:20px 17px 13px}.actions{padding:0 17px 20px}.action{min-height:67px}.outcome{margin:8px 17px 20px}.intro,.end{box-shadow:7px 7px 0 var(--ink)}}@media(max-width:390px){.stat>span{display:none}.stat{justify-content:center}.eventCopy h2{font-size:1.9rem}.center{padding:11px}.brand small{display:none}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main id="app"></main>
<script>
const events=[
["KEYBOARD CRISIS","⌨️","Keyboard Occupation","Pepper has become one with your keyboard. Your document now says: “jjjjjjjj.”",[["Offer the decoy keyboard","Clever preparation pays off.",{focus:1,progress:12,chaos:-1},"Pepper accepts the decoy. You feel dangerously competent."],["Relocate the cat","Quick, direct, personally offensive.",{focus:-1,progress:9,chaos:1},"Pepper returns before your hand reaches the mouse."],["Work around the paws","Adaptability or surrender?",{focus:-2,progress:6,chaos:1},"You typed half a sentence and opened Calculator seven times."]]],
["GRAVITY EXPERIMENT","🥛","The Cup Is Too Close","Mochi has noticed your water glass near the edge. The paw is already moving.",[["Catch the glass","Save the desk, lose momentum.",{focus:-1,progress:7},"Disaster prevented by one heroic grab."],["Use one treat","Redirect the tiny scientist.",{treats:-1,progress:12,chaos:-1},"Experiment cancelled due to snack funding."],["Call the bluff","Surely the cat would never—",{focus:-2,chaos:2,progress:4},"The cat absolutely would. Your notes are now waterfront property."]]],
["URGENT REQUEST","🍽️","Haven't Eaten in 17 Minutes","Two cats stare at you beside bowls containing visible food.",[["Refresh the bowls","Apparently presentation matters.",{focus:-1,progress:7,chaos:-1},"The exact same food is acceptable after being rearranged."],["Schedule snack time","Hold the boundary.",{focus:1,progress:10,chaos:1},"The protest continues, but so does your work."],["Deploy treats","Buy fifteen minutes of peace.",{treats:-1,progress:15,chaos:-1},"Silence. Beautiful, crunchy silence."]]],
["VIDEO CALL","📹","Tail in the Meeting","A magnificent tail rises directly in front of your camera during a serious call.",[["Pretend nothing happened","Professional composure.",{focus:-1,progress:10},"Everyone saw it. Nobody objected."],["Introduce your coworker","Turn chaos into charm.",{focus:1,progress:9,chaos:-1},"Mochi is now the most popular person in the meeting."],["Turn off the camera","Solve one problem instantly.",{progress:8},"Your voice remains professional. Your background does not."]]],
["MYSTERY SOUND","💥","Crash in the Other Room","You hear one loud crash, followed by the most suspicious silence in history.",[["Investigate immediately","Responsible, but disruptive.",{focus:-1,progress:5,chaos:-2},"One plant is sideways. Both cats deny involvement."],["Finish this paragraph","Delay the inevitable.",{progress:13,chaos:1},"The paragraph is excellent. The cleanup is not."],["Call their names","Remote diagnostics.",{focus:1,progress:9},"One cat appears. The other sends no comment."]]],
["POWER MOVE","🪑","Your Chair Is Occupied","You stood up for eight seconds. Pepper now owns your chair by ancient law.",[["Bring another chair","Avoid negotiations.",{progress:10,chaos:1},"Pepper watches you sit in the inferior chair."],["Share the seat","Ergonomically questionable.",{focus:-1,progress:8,chaos:-1},"You work sideways. Pepper is extremely comfortable."],["Exchange for a treat","A lawful transfer of power.",{treats:-1,progress:14,chaos:-1},"The chair is yours again—for now."]]],
["TECH SUPPORT","🔌","Cable Ambush","Mochi has discovered that the charging cable moves when attacked.",[["Hide the cable","Spend a moment cat-proofing.",{progress:7,chaos:-2},"The cable is safe and the desk looks almost organized."],["Redirect with a toy","Good strategy, limited duration.",{focus:1,progress:10},"Mochi launches a separate campaign against the toy."],["Risk it","You need that charger.",{focus:-2,progress:12,chaos:1},"You worked quickly while monitoring every tooth."]]],
["AFFECTION TAX","🐾","Mandatory Lap Time","Pepper climbs into your lap, circles twice, and begins purring at maximum volume.",[["Accept the cuddle","Restore focus, reduce typing speed.",{focus:2,progress:7,chaos:-1},"Your posture is terrible. Your spirit is healed."],["Move to the cat bed","Offer a reasonable alternative.",{focus:-1,progress:11},"Pepper rejects the proposal but respects the attempt."],["Use voice typing","Adapt and continue.",{progress:12},"Your document contains three accidental mentions of tuna."]]],
["NIGHT SHIFT","🌙","Sudden Zoomies","Both cats begin a high-speed relay through the room. The route crosses your desk.",[["Pause for playtime","Burn off the chaos.",{focus:1,progress:5,chaos:-2},"Ten minutes of play buys a surprisingly peaceful truce."],["Close the door","Protect the work zone.",{focus:-1,progress:13,chaos:1},"The scratching adds a dramatic soundtrack."],["Let the storm pass","Secure the mug and wait.",{progress:9},"The storm ends as suddenly as it began."]]],
["QUALITY CONTROL","📄","Paper Inspection","Your printed notes are being sat on, chewed, and carefully redistributed.",[["Scan them first","Create a safer backup.",{progress:10,chaos:-1},"The notes are digital. The paper may now belong to the cats."],["Trade for a box","Apply known cat economics.",{progress:13,chaos:-2},"The empty box wins immediately."],["Retrieve every page","Choose direct conflict.",{focus:-2,progress:7,chaos:1},"You recovered the notes. One corner is confidentially missing."]]],
["DOOR DEBATE","🚪","In. Out. In Again.","Mochi requests the door open, exits, then immediately requests re-entry.",[["Become the doorman","Provide premium service.",{focus:-2,progress:6,chaos:-1},"Five door cycles later, Mochi is exactly where she started."],["Leave it cracked","A practical compromise.",{progress:11,chaos:1},"Independence achieved. Air conditioning defeated."],["Hold the boundary","The door stays closed.",{focus:1,progress:12,chaos:1},"A speech is delivered from the hallway."]]],
["FINAL BOSS","📦","The Delivery Box","A package arrives. Both cats claim the box before you remove the contents.",[["Give them the box","The correct answer, obviously.",{focus:1,progress:13,chaos:-2},"Instant enrichment. Productivity rises across the household."],["Save it for later","Finish the task first.",{progress:15,chaos:1},"The cats supervise the unopened box with growing intensity."],["Build a box fort","Abandon productivity for architecture.",{focus:2,progress:4,chaos:-3},"The fort is magnificent. Your task is not finished."]]]
].map(e=>({type:e[0],icon:e[1],title:e[2],story:e[3],choices:e[4].map(x=>({label:x[0],detail:x[1],effect:x[2],result:x[3]}))}));
let deck=[],turn=0,s={},outcome=null;const app=document.querySelector("#app"),clip=(n,min,max)=>Math.max(min,Math.min(max,n));
function intro(){app.innerHTML=`<section class="center"><div class="intro"><div class="cats"><span class="cat">🐈</span><span class="cat">🐈‍⬛</span></div><p class="kicker">PRODUCTIVITY EDITION</p><h1>CAT<br><span>CHAOS</span></h1><p class="introText">Finish your work before the cats destroy your focus, your room, or the very concept of productivity.</p><div class="mission"><span>🎯</span><div><b>Complete the mission</b><small>Reach 100% task progress in 12 turns. Keep Focus above zero and Chaos below six.</small></div></div><button class="primary" onclick="start()">Start the work session →</button><p class="fine">One player · Two cats · Absolutely no respect for deadlines</p></div></section>`}
function start(){deck=[...events].sort(()=>Math.random()-.5);turn=0;s={focus:6,chaos:1,treats:3,progress:0};outcome=null;render()}
function stat(icon,label,value){return `<div class="stat"><span>${icon}</span><div><small>${label}</small><b>${value}</b></div></div>`}
function act(i){const c=deck[turn].choices[i],emptyTreatJar=c.effect.treats<0&&s.treats===0;for(const k in c.effect)s[k]=(s[k]||0)+c.effect[k];s.focus=clip(s.focus,0,8);s.chaos=clip(s.chaos,0,6);s.treats=clip(s.treats,0,5);s.progress=clip(s.progress,0,100);if(emptyTreatJar){s.focus=clip(s.focus-1,0,8);outcome="You reached for a treat and found only crumbs. The cats noticed. "+c.result}else outcome=c.result;render()}
function next(){turn++;outcome=null;render()}
function render(){if(s.progress>=100||turn>=12||s.focus<=0||s.chaos>=6)return finish();const e=deck[turn];app.innerHTML=`<section class="game"><header class="top"><div class="brand"><span class="mark">🐾</span><div><b>CAT CHAOS</b><small>Productivity Edition</small></div></div><div class="turn">TURN <b>${turn+1}</b> / 12</div></header><div class="hud"><div class="stats">${stat("🧠","Focus",s.focus)}${stat("🌪️","Chaos",s.chaos+"/6")}${stat("🐟","Treats",s.treats)}</div><div class="taskBox"><div class="taskTop"><span>TASK PROGRESS</span><b>${s.progress}%</b></div><div class="bar"><i style="width:${s.progress}%"></i></div></div></div><div class="arena"><article class="event"><div class="eventHead"><span class="type">${e.type}</span><span class="bigEmoji">${e.icon}</span></div><div class="eventCopy"><h2>${e.title}</h2><p>${e.story}</p></div>${outcome?`<div class="outcome"><div class="face">${s.chaos>=4?"🙀":"😸"}</div><p>${outcome}</p><button onclick="next()">Continue working →</button></div>`:`<div class="actions"><p>HOW DO YOU RESPOND?</p>${e.choices.map((c,i)=>`<button class="action" onclick="act(${i})"><span class="key">${i+1}</span><span><b>${c.label}</b><small>${c.detail}</small></span><span>→</span></button>`).join("")}</div>`}</article><aside><div class="room"><span class="roomLabel">LIVE CHAOS CAM</span><div class="window"></div><div class="desk"></div><div class="laptop"></div><span class="roomCat">🐈</span><span class="roomCat two">🐈‍⬛</span><span class="mess m1">${s.chaos>3?"🧻":"🧶"}</span><span class="mess m2">${s.chaos>4?"🪴":"☕"}</span></div><p class="tip">The room gets messier as Chaos rises. Treats can buy peace, but supplies are limited.</p></aside></div></section>`}
function finish(){const win=s.progress>=100&&s.focus>0&&s.chaos<6;let score=Math.max(0,s.progress+s.focus*5-s.chaos*6+s.treats*2),grade=score>=125?"S":score>=105?"A":score>=85?"B":score>=65?"C":"CAT";let reason=win?"You finished the task despite professional-grade feline interference.":s.focus<=0?"Your focus has left the building. The cats remain.":s.chaos>=6?"The room has achieved total cat ownership.":"The session ended before the task was finished.";app.innerHTML=`<section class="center"><div class="end"><div class="cats"><span class="cat">${win?"😸":"🙀"}</span><span class="cat">${win?"😼":"😹"}</span></div><p class="kicker">${win?"MISSION COMPLETE":"SESSION OVER"}</p><h2>${win?"Productivity survived!":"The cats won this round."}</h2><div class="score">${score}</div><span class="grade">RANK: ${grade}</span><p class="summary">${reason}</p><div class="finalStats">${stat("✅","Progress",s.progress+"%")}${stat("🧠","Focus",s.focus)}${stat("🌪️","Chaos",s.chaos+"/6")}</div><button class="primary" onclick="start()">↻ Try another session</button></div></section>`}
document.addEventListener("keydown",e=>{if(!outcome&&["1","2","3"].includes(e.key)&&deck[turn])act(Number(e.key)-1)});intro();
</script></body></html>
