<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Life Happens — Card Game</title>
<style>
:root{--ink:#151528;--purple:#5b3df5;--cream:#f6f3ea;--gold:#ffca57;--mint:#43d7a0;--line:#d9d4c7}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,sans-serif;min-width:320px}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}.screen{min-height:100svh}.center{display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 12% 10%,#ffdf92 0 8%,transparent 24%),radial-gradient(circle at 85% 90%,#9e8cff 0 6%,transparent 26%),var(--purple)}.panel{width:min(560px,100%);background:var(--cream);padding:clamp(28px,6vw,54px);border:3px solid var(--ink);box-shadow:12px 12px 0 var(--ink);text-align:center}.logo{width:56px;height:56px;display:grid;place-items:center;margin:0 auto 18px;background:var(--gold);border:2px solid var(--ink);border-radius:50%;font-size:1.7rem}.eyebrow{font-size:.78rem;font-weight:900;letter-spacing:.19em;margin:0 0 16px}.panel h1{font-size:clamp(3.5rem,12vw,6.4rem);line-height:.76;letter-spacing:-.08em;margin:0}.panel h1 span{color:var(--purple)}.intro{font-size:1.05rem;line-height:1.6;max-width:430px;margin:30px auto}.goal{display:flex;gap:14px;text-align:left;align-items:center;padding:16px;border:2px solid var(--ink);background:#fff;margin-bottom:20px}.goal b,.goal span{display:block}.goal span{font-size:.88rem;margin-top:3px;color:#555365}.primary{width:100%;min-height:55px;border:2px solid var(--ink);background:var(--gold);font-weight:900;box-shadow:5px 5px 0 var(--ink)}.primary:hover{transform:translate(2px,2px);box-shadow:3px 3px 0 var(--ink)}.fine{font-size:.77rem;color:#6c6877;margin:18px 0 0}.game{max-width:1180px;margin:auto;padding:20px clamp(16px,4vw,44px) 40px}.top{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:15px}.brand{display:flex;align-items:center;gap:11px}.brandmark{width:43px;height:43px;border:2px solid var(--ink);background:var(--purple);color:#fff;display:grid;place-items:center;font-weight:900;box-shadow:3px 3px 0 var(--ink)}.brand b,.brand small{display:block}.brand small{font-size:.72rem;color:#6c6877}.round{font-size:.75rem;letter-spacing:.12em}.round b{font-size:1.1rem;color:var(--purple)}.dashboard{display:grid;grid-template-columns:1.2fr .8fr;gap:18px;margin:22px 0}.resources{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{min-height:64px;display:flex;align-items:center;gap:11px;padding:10px 14px;background:#fff;border:1.5px solid var(--line)}.statIcon{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#ebe7ff;font-size:1.1rem}.stat small,.stat strong{display:block}.stat small{font-size:.65rem;letter-spacing:.1em;color:#777382;text-transform:uppercase}.stat strong{font-size:1.35rem}.stability{padding:11px 14px;background:var(--ink);color:#fff}.stabTop{display:flex;align-items:center;gap:8px}.stabTop span{font-size:.7rem;font-weight:900;letter-spacing:.12em}.stabTop b{margin-left:auto;color:var(--gold)}.pips{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:9px}.pips i{height:8px;border:1px solid #777388;background:#39384b}.pips i.on{background:var(--mint);border-color:var(--mint)}.play{display:grid;grid-template-columns:minmax(0,720px) 1fr;gap:clamp(28px,7vw,80px);align-items:center}.card{background:#fff;border:3px solid var(--ink);box-shadow:10px 10px 0 var(--ink);min-height:520px;display:flex;flex-direction:column;animation:deal .35s ease-out}.cardTop{height:118px;background:var(--purple);color:#fff;padding:20px 24px;display:flex;align-items:flex-start;justify-content:space-between;border-bottom:3px solid var(--ink)}.category{font-size:.7rem;font-weight:900;letter-spacing:.16em;border:1px solid #ffffff88;padding:7px 9px}.emoji{font-size:3.4rem}.copy{padding:27px 28px 20px}.copy h2{font-size:clamp(2rem,5vw,3.4rem);letter-spacing:-.055em;line-height:.95;margin:0 0 14px;text-transform:uppercase}.copy p{font-size:1rem;line-height:1.55;margin:0;color:#555365}.choices{padding:0 28px 28px;margin-top:auto}.choices>p{font-size:.68rem;font-weight:900;letter-spacing:.15em}.choice{width:100%;min-height:65px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:13px;text-align:left;border:1.5px solid var(--ink);background:#f9f8f3;padding:10px;margin-top:9px}.choice:hover{background:#ebe7ff;transform:translateX(3px)}.num{width:34px;height:34px;display:grid;place-items:center;background:var(--gold);border:1.5px solid var(--ink);font-weight:900}.choice b,.choice small{display:block}.choice small{font-size:.77rem;color:#696676;margin-top:3px}.result{margin:auto 28px 28px;padding:24px;background:#ebe7ff;border:2px solid var(--purple);text-align:center}.result p{font-size:1.08rem;line-height:1.5}.result button{border:0;background:var(--purple);color:#fff;padding:13px 20px;font-weight:900}.side{text-align:center;color:#696676;font-size:.86rem;line-height:1.5}.deck{height:260px;max-width:190px;margin:0 auto 25px;background:var(--purple);color:#fff;border:2px solid var(--ink);box-shadow:9px 9px 0 var(--gold),14px 14px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center}.deck b{font-size:1.8rem;line-height:.82}.deck small{margin-top:30px}.endEmoji{font-size:4rem}.panel h2{font-size:clamp(2.1rem,8vw,4rem);line-height:1;margin:12px 0 18px}.final{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:28px 0}@keyframes deal{from{opacity:0;transform:translateY(14px) rotate(-1deg)}}@media(max-width:760px){.game{padding:12px 12px 28px}.dashboard{grid-template-columns:1fr;margin:14px 0}.resources{gap:6px}.stat{padding:8px;gap:7px;min-height:57px}.play{display:block}.side{display:none}.card{min-height:0;box-shadow:6px 6px 0 var(--ink)}.cardTop{height:86px;padding:15px 17px}.emoji{font-size:2.7rem}.copy{padding:22px 18px 14px}.choices{padding:0 18px 22px}.choice{min-height:68px}.brand small{display:none}.result{margin:10px 18px 22px}.panel{box-shadow:7px 7px 0 var(--ink)}}@media(max-width:390px){.statIcon{display:none}.stat{justify-content:center}.copy h2{font-size:1.9rem}.center{padding:12px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body><main id="app"></main>
<script>
const cards=[
{category:"TRANSPORTATION",icon:"🚗",title:"Check Engine Light",story:"Your dashboard lights up like a tiny, expensive Christmas tree.",choices:[["See the mechanic","Pay now, protect your peace.",{money:-2,stability:1},"Painful, but handled. Your car lives another day."],["Ignore it","Save money and hope loudly.",{energy:-2,time:-1},"Every strange noise now has your full attention."],["Call a handy friend","Trade time for a cheaper fix.",{money:-1,time:-1},"Three videos and one store trip later: fixed."]]},
{category:"CAREER",icon:"💼",title:"Stretch Assignment",story:"Your manager offers a visible project. It could open doors—or eat your week.",choices:[["Take the lead","Spend energy to build momentum.",{energy:-2,stability:1},"You delivered. People remember your name."],["Ask for support","Negotiate a better setup.",{time:-1,energy:-1,stability:1},"Clear scope, shared workload, solid result."],["Pass this time","Protect your capacity.",{energy:1},"You keep your week intact."]]},
{category:"HOME",icon:"🏠",title:"The Mystery Leak",story:"There is water where water has absolutely no business being.",choices:[["Call a plumber","Expensive. Immediate. Done.",{money:-2,stability:1},"The leak is gone. Part of your paycheck is too."],["DIY investigation","Spend Saturday learning pipes.",{time:-2,energy:-1},"You found the valve—and three new questions."],["Put down a bucket","A classic temporary solution.",{energy:-1,stability:-1},"The bucket works until it becomes furniture."]]},
{category:"MONEY",icon:"💳",title:"Surprise Refund",story:"An old overpayment lands back in your account. Nobody saw this plot twist coming.",choices:[["Build your cushion","Boring in the best way.",{money:1,stability:1},"Future-you sends a quiet thank-you."],["Treat yourself","Joy is a resource too.",{money:1,energy:1},"A responsible little splurge restores the spirit."],["Clear a bill","Turn relief into breathing room.",{stability:1},"One less payment is taking space in your head."]]},
{category:"HEALTH",icon:"🧠",title:"Running on Empty",story:"You completed twelve tasks and emotionally processed none of them.",choices:[["Cancel and rest","Lose time, regain capacity.",{time:-1,energy:2},"The world kept spinning while you took a nap."],["Push through","Finish today, borrow from tomorrow.",{energy:-2,stability:1},"Task complete. Battery critically low."],["Do the minimum","A tiny plan for a tired day.",{energy:1},"Good enough was, in fact, good enough."]]},
{category:"FAMILY",icon:"📞",title:"A Tiny Favor",story:"It is described as “tiny.” History suggests otherwise.",choices:[["Say yes","Help out, lose your afternoon.",{time:-2,energy:-1},"The tiny favor had three acts and an intermission."],["Set a time limit","Help without donating the day.",{time:-1,stability:1},"A boundary! Everyone survived it."],["Say not today","Keep your plans intact.",{energy:1},"Brief discomfort, lasting peace."]]},
{category:"OPPORTUNITY",icon:"🌱",title:"Side Hustle Spark",story:"A simple idea might make extra money—if you give it room to grow.",choices:[["Run a small test","Spend little, learn a lot.",{time:-1,money:1,stability:1},"Small proof beats a giant plan."],["Go all in","Big effort, bigger upside.",{time:-2,energy:-2,money:2},"Profitable, but your calendar is smoking."],["Save it for later","Good ideas can wait safely.",{energy:1},"Captured, not forgotten."]]},
{category:"PET CHAOS",icon:"🐈",title:"3 A.M. Zoomies",story:"Your cat schedules a full-speed hallway conference for the middle of the night.",choices:[["Attempt diplomacy","Negotiate with a small athlete.",{time:-1,energy:-1},"Terms were discussed. No agreement was reached."],["Deploy the toy","Trade time for quieter sleep.",{time:-1,energy:1},"The cat is tired. Tactical genius."],["Close the door","Simple in theory.",{energy:-1},"The scratching begins."]]},
{category:"SOCIAL",icon:"🎉",title:"Last-Minute Invitation",story:"A fun night appears just as you planned to catch up on everything.",choices:[["Go have fun","Spend time, restore energy.",{time:-1,energy:2},"You laughed hard enough to remember you are a person."],["Finish your plan","Use energy to gain stability.",{energy:-1,stability:1},"The list is shorter. Your brain is quieter."],["Make a brief appearance","Balance both, perfectly enough.",{time:-1,energy:1},"You showed up and kept tomorrow intact."]]},
{category:"EDUCATION",icon:"📚",title:"Deadline Pileup",story:"Two assignments and a quiz have formed an alliance against your calendar.",choices:[["Use a study block","Focused time, real progress.",{time:-2,stability:1},"One block at a time. The pile is now a stack."],["Pull an all-nighter","Save time, drain energy.",{energy:-2,stability:1},"Submitted at 3:57 a.m. Technically a victory."],["Ask for clarity","A message may prevent rework.",{time:-1,energy:1},"It was simpler than your anxiety suggested."]]}
];
let deck=[],round=0,stats={},result=null;
const app=document.querySelector("#app"),clamp=n=>Math.max(0,Math.min(9,n));
function stat(icon,label,value){return `<div class="stat"><span class="statIcon">${icon}</span><span><small>${label}</small><strong>${value}</strong></span></div>`}
function start(){deck=[...cards].sort(()=>Math.random()-.5);round=0;stats={money:5,energy:5,time:5,stability:0};result=null;render()}
function intro(){app.innerHTML=`<section class="screen center"><div class="panel"><div class="logo">✦</div><p class="eyebrow">A LIFE STRATEGY CARD GAME</p><h1>LIFE<br><span>HAPPENS</span></h1><p class="intro">You had a plan. Then the car made a noise, your boss called, and your cat chose chaos.</p><div class="goal"><span style="font-size:1.7rem">🛡️</span><div><b>Your goal</b><span>Collect 5 Stability points before a resource hits zero.</span></div></div><button class="primary" onclick="start()">Deal the first card →</button><p class="fine">10 rounds · One player · Decisions have consequences</p></div></section>`}
function choose(i){const c=deck[round].choices[i];Object.keys(c[2]).forEach(k=>stats[k]=clamp(stats[k]+c[2][k]));result=c[3];render()}
function next(){round++;result=null;render()}
function render(){if(round>=10||stats.money===0||stats.energy===0||stats.time===0)return end();const c=deck[round],pips=[0,1,2,3,4].map(i=>`<i class="${i<stats.stability?"on":""}"></i>`).join("");app.innerHTML=`<section class="screen game"><header class="top"><div class="brand"><span class="brandmark">LH</span><div><b>LIFE HAPPENS</b><small>You had a plan.</small></div></div><div class="round">ROUND <b>${round+1}</b> / 10</div></header><div class="dashboard"><div class="resources">${stat("＄","Money",stats.money)}${stat("⚡","Energy",stats.energy)}${stat("◷","Time",stats.time)}</div><div class="stability"><div class="stabTop"><span>🛡️ STABILITY</span><b>${stats.stability}/5</b></div><div class="pips">${pips}</div></div></div><div class="play"><article class="card"><div class="cardTop"><span class="category">${c.category}</span><span class="emoji">${c.icon}</span></div><div class="copy"><h2>${c.title}</h2><p>${c.story}</p></div>${result?`<div class="result"><div style="font-size:1.5rem">♥</div><p>${result}</p><button onclick="next()">Next card →</button></div>`:`<div class="choices"><p>WHAT DO YOU DO?</p>${c.choices.map((x,i)=>`<button class="choice" onclick="choose(${i})"><span class="num">${i+1}</span><span><b>${x[0]}</b><small>${x[1]}</small></span><span>→</span></button>`).join("")}</div>`}</article><aside class="side"><div class="deck"><span style="font-size:1.5rem">✦</span><b>LIFE<br>HAPPENS</b><small>${9-round} cards left</small></div><p>Build stability without running out of money, energy, or time.</p></aside></div></section>`}
function end(){const won=stats.stability>=5&&stats.money>0&&stats.energy>0&&stats.time>0;app.innerHTML=`<section class="screen center"><div class="panel"><div class="endEmoji">${won?"🏆":"🌦️"}</div><p class="eyebrow">FINAL SCORE · ${stats.stability} STABILITY</p><h2>${won?"You built a stable life!":"Life happened. You’re still standing."}</h2><p>${won?"Five stability points and resources to spare. That’s not luck—that’s a system.":"Try a new approach and build five stability points."}</p><div class="final">${stat("＄","Money",stats.money)}${stat("⚡","Energy",stats.energy)}${stat("◷","Time",stats.time)}</div><button class="primary" onclick="start()">↻ Play again</button></div></section>`}
intro();
</script></body></html>
